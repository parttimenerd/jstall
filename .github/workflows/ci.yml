name: CI

on:
  push:
    branches: [ '**' ]  # Build all branches
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Run every 25 days to ensure fresh artifacts
    - cron: '0 0 */25 * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17, 21, 25]

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'sapmachine'
          cache: maven

      - name: Build package
        run: mvn package -DskipTests

      - name: Preserve external test JAR
        if: matrix.java-version == 17
        run: cp target/jstall.jar "$RUNNER_TEMP/jstall-external.jar"

      - name: Upload JAR artifact
        if: matrix.java-version == 17
        uses: actions/upload-artifact@v4
        with:
          name: jstall-jar
          path: target/jstall.jar
          retention-days: 30

      - name: Upload executable artifact
        if: matrix.java-version == 17
        uses: actions/upload-artifact@v4
        with:
          name: jstall
          path: target/jstall
          retention-days: 30

      - name: Run tests
        run: mvn clean test

      - name: Run tests with external JAR
        if: matrix.java-version == 17
        run: mvn test -Dtest.externalJar="$RUNNER_TEMP/jstall-external.jar"

      - name: Run tests with shell execution mode
        if: matrix.java-version == 17
        run: mvn test -Dtest.forceRunWithShell=true

      - name: Regenerate thread-dump fixtures
        if: matrix.java-version == 17
        run: mvn test -Dtest=ThreadDumpGeneratorTest -Djstall.generateThreadDumpFixtures=true

      - name: Run tests with regenerated fixtures
        if: matrix.java-version == 17
        run: mvn test

      - name: Build + test minimal variant with comprehensive testing
        if: matrix.java-version == 17
        run: python3 release.py test-minimal-jar

      - name: Verify minimal artifact is femtojar-reencoded
        if: matrix.java-version == 17
        run: |
          test -f target/jstall-minimal.jar
          unzip -l target/jstall-minimal.jar | grep 'me/bechberger/femtojar/rt/BundleBootstrap.class'
          unzip -p target/jstall-minimal.jar META-INF/MANIFEST.MF | grep '^Main-Class: me.bechberger.femtojar.rt.BundleBootstrap'
          unzip -p target/jstall-minimal.jar META-INF/MANIFEST.MF | grep '^X-Original-Main-Class:'

      - name: Upload minimal JAR artifact
        if: matrix.java-version == 17
        uses: actions/upload-artifact@v4
        with:
          name: jstall-minimal-jar
          path: target/jstall-minimal.jar
          retention-days: 30

      - name: Upload minimal executable artifact
        if: matrix.java-version == 17
        uses: actions/upload-artifact@v4
        with:
          name: jstall-minimal
          path: target/jstall-minimal
          retention-days: 30

  windows-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'sapmachine'
          cache: maven

      - name: Build package
        run: mvn package -DskipTests

      - name: Set up OpenSSH Server
        shell: pwsh
        run: |
          # Install OpenSSH Server optional feature
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0

          # Start sshd
          Start-Service sshd

          # Generate ed25519 keypair (no passphrase, no prompts)
          $sshDir = "$env:USERPROFILE\.ssh"
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          ssh-keygen -t ed25519 -f "$sshDir\id_ed25519" -N '""'

          # Wire up authorized_keys for admin users
          $adminKeysFile = "C:\ProgramData\ssh\administrators_authorized_keys"
          Copy-Item "$sshDir\id_ed25519.pub" $adminKeysFile

          # Fix ACLs: only SYSTEM and Administrators, no inheritance
          icacls $adminKeysFile /inheritance:r /grant "SYSTEM:(F)" /grant "Administrators:(F)"

          # Pre-populate known_hosts so ssh doesn't prompt
          $hostKey = (ssh-keyscan -H localhost 2>$null)
          Add-Content "$sshDir\known_hosts" $hostKey

          # Smoke-test: verify ssh localhost works
          $result = ssh -o StrictHostKeyChecking=no localhost "echo hello"
          if ($result -ne "hello") {
            Write-Error "SSH loopback smoke test failed: got '$result'"
            exit 1
          }
          Write-Host "SSH loopback OK"

      - name: Run jstall SSH loopback test
        shell: pwsh
        run: |
          # Compile Hello.java (uses the JDK set up by setup-java above)
          javac Hello.java

          # Start background JVM
          $proc = Start-Process -FilePath "java" -ArgumentList "-cp", ".", "Hello" `
                    -PassThru -WindowStyle Hidden
          $pid = $proc.Id
          Write-Host "Started Hello JVM with PID $pid"

          # Wait for JVM attach mechanism to become ready (Attach Listener starts ~2s in)
          Start-Sleep -Seconds 5

          # Run jstall via the jar with SSH loopback
          java -jar target\jstall.jar --ssh "ssh -o StrictHostKeyChecking=no localhost" status $pid
          $exitCode = $LASTEXITCODE

          # Clean up
          Stop-Process -Id $pid -Force -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {
            Write-Error "jstall --ssh loopback test failed with exit code $exitCode"
            exit $exitCode
          }
          Write-Host "jstall SSH loopback test passed"